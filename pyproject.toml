[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pap-toolbox"
version = "0.1.0"
description = "Helper tools for data analysis and uncertainty calculations in the Heidelberg physics lab course."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Tiago Luis Camisón Grimbach" }
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "sympy>=1.8.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "ipython>=7.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/tiagocamison/PAP-Toolbox"

[tool.setuptools]
py-modules = ["pap_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
